<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lighter greens when the browser's own theme is dark (its tab bar). -->
  <style>
    .flange { fill: #2f6b3a; }
    .web { fill: #265830; }
    @media (prefers-color-scheme: dark) {
      .flange { fill: #77c385; }
      .web { fill: #5fae6e; }
    }
  </style>
  <rect class="flange" x="6" y="8" width="52" height="11" rx="2"/>
  <rect class="web" x="26" y="19" width="12" height="26"/>
  <rect class="flange" x="6" y="45" width="52" height="11" rx="2"/>
</svg>
