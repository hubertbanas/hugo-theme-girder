# Checks every pull request and push. A push to main also publishes the demo
# site (exampleSite/) to GitHub Pages. README.md, "Publishing the demo", has
# the one-time setup.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, spelling, private terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format, lint and spelling
        run: npm run check

      # The denylist is private: it comes from the PRIVATE_TERMS secret (one
      # term per line). Pull requests from forks don't get secrets, so there
      # the scan is skipped with a warning.
      - name: Private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "::warning::PRIVATE_TERMS secret not available; private-term scan skipped"
            exit 0
          fi
          npm run check:private

  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.target.outputs.base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Pages address on main (https://<owner>.github.io/<repo>/);
      # elsewhere a stand-in with the same kind of sub-path, so the build
      # check catches links that would break on Pages.
      - name: Pick the base URL
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          else
            url="https://example.org/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "Building for $url"

      # Resized images, kept between runs; their file names hold a hash of the
      # image and the settings, and --gc drops unused ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: exampleSite/resources/_gen
          key: hugo-images-${{ hashFiles('exampleSite/assets/images/**', 'exampleSite/content/**/*.jpg', 'layouts/_partials/img.html') }}
          restore-keys: hugo-images-

      # The same Hugo image as the local preview (compose.yaml), so CI and
      # ./site.sh build the same way.
      - name: Build
        run: ./site.sh build
        env:
          SITE_URL: ${{ steps.target.outputs.base_url }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the build
        run: npm run check:build
        env:
          SITE_URL: ${{ steps.target.outputs.base_url }}

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: exampleSite/public

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
